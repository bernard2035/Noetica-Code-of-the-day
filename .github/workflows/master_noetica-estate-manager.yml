name: Build and deploy Node.js app to Azure Web App - noetica-estate-manager

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm ci --legacy-peer-deps
          echo 'DATABASE_URL="postgresql://noetica_admin:avTnikXaae7ZoO7SfXZvPQ@noetica-postgres-db.postgres.database.azure.com/postgres?sslmode=require"' > .env
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run build --if-present
          npm run test --if-present
        
      - name: Zip artifact for deployment
        run: |
          cp -r public .next/standalone/ || true
          cp -r .next/static .next/standalone/.next/ || true
          cp -r prisma .next/standalone/ || true
          cd .next/standalone
          # Remove node_modules to avoid huge zip file and ZipDeploy timeout
          rm -rf node_modules
          # Create .deployment file to force Kudu to run npm install on the standalone package.json
          echo -e "[config]\nSCM_DO_BUILD_DURING_DEPLOYMENT=true" > .deployment
          zip -r ../../release.zip . -q
          cd ../../

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'noetica-estate-manager'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B1234 }}
          package: .
