name: Build and deploy Node.js app to Azure Web App - noetica-estate-manager

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Build Next.js app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Prepare standalone package
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          cp -r public .next/standalone/ || true
          cp -r .next/static .next/standalone/.next/ || true
          cp -r prisma .next/standalone/ || true

          # Write runtime env vars into standalone so Azure can start the app
          cat > .next/standalone/.env << EOF
          DATABASE_URL="$DATABASE_URL"
          NEXTAUTH_URL="$NEXTAUTH_URL"
          NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
          GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
          GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
          MICROSOFT_CLIENT_ID="$MICROSOFT_CLIENT_ID"
          MICROSOFT_CLIENT_SECRET="$MICROSOFT_CLIENT_SECRET"
          MICROSOFT_TENANT_ID="$MICROSOFT_TENANT_ID"
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN="$NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN"
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY="$NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY"
          PAYSTACK_SECRET_KEY="$PAYSTACK_SECRET_KEY"
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
          PORT="8080"
          EOF

          cd .next/standalone
          zip -r ../../release.zip . -q
          cd ../../

      - name: Deploy via Kudu ZipDeploy
        env:
          KUDU_USER: ${{ secrets.KUDU_USER }}
          KUDU_PASS: ${{ secrets.KUDU_PASS }}
        run: |
          echo "Deploying to Azure via Kudu ZipDeploy..."
          HTTP_STATUS=$(curl -s -o /tmp/kudu_response.txt -w "%{http_code}" \
            -X POST \
            -u "${KUDU_USER}:${KUDU_PASS}" \
            -H "Content-Type: application/zip" \
            --data-binary @release.zip \
            "https://noetica-estate-manager.scm.azurewebsites.net/api/zipdeploy")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/kudu_response.txt
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "Deployment failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Deployment successful!"
